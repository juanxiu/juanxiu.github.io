<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
<title id="title">AI 에이전트 파일 입력 구조 설계</title>
<desc id="desc">파일명과 ID를 먼저 모델에 전달하고, 본문이 필요할 때 모델이 파일 읽기 도구 호출을 요청합니다. 애플리케이션 서버가 TTL 캐시를 확인하고, 캐시가 없으면 S3에서 원문을 조회합니다. 서버가 크기를 제한한 도구 결과를 모델 입력으로 전달하고, 모델은 이를 바탕으로 답변합니다. 논리 흐름을 나타내며 배포 위치나 모델 제공업체를 지정하지 않습니다.</desc>
<defs>
<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#34715d"/></marker>
<marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b15c31"/></marker>
