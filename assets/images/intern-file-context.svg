<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#7c8d80" stroke-width="1.4"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style>
<rect width="1000" height="610" fill="#fffefa"/>
<title id="title">파일 전체 대신, 필요한 부분만 LLM에 전달</title><desc id="desc">파일 전체를 매번 넣지 않고, 도구로 읽은 범위만 다음 모델 입력에 추가</desc>
<text x="36" y="45" text-anchor="start" font-size="26" font-weight="720" fill="#273631"><tspan x="36" dy="0">파일 전체 대신, 필요한 부분만 LLM에 전달</tspan></text>
<text x="36" y="75" text-anchor="start" font-size="15" font-weight="400" fill="#637168"><tspan x="36" dy="0">원문 저장과 모델 입력을 분리한 두 단계의 lazy loading</tspan></text>
<rect x="24" y="105" width="952" height="185" rx="10" fill="#fcf2ed" stroke="#ead5cb"/>
<text x="45" y="136" text-anchor="start" font-size="14" font-weight="750" fill="#9b5238"><tspan x="45" dy="0">AS-IS</tspan></text>
<rect x="45.0" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="187.33333333333334" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="187.33333333333334" dy="0">원본 파일은 S3에 저장</tspan><tspan x="187.33333333333334" dy="26">추출한 본문은 DB에 저장</tspan></text>
<path d="M333.6666666666667 195H351.6666666666667" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="357.6666666666667" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="500.0" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="500.0" dy="0">매 요청마다</tspan><tspan x="500.0" dy="26">파일 본문 전체 첨부</tspan></text>
<path d="M646.3333333333334 195H664.3333333333334" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="670.3333333333334" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="812.6666666666667" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="812.6666666666667" dy="0">필요 여부와 관계없이</tspan><tspan x="812.6666666666667" dy="26">LLM이 전체 본문 처리</tspan></text>
<text x="45" y="267" text-anchor="start" font-size="14" font-weight="450" fill="#9b5238"><tspan x="45" dy="0">반복되는 파일 입력으로 모델의 컨텍스트가 계속 커짐</tspan></text>
<rect x="24" y="315" width="952" height="205" rx="10" fill="#eef5ee" stroke="#c9decb"/>
<text x="45" y="346" text-anchor="start" font-size="14" font-weight="750" fill="#376c5c"><tspan x="45" dy="0">TO-BE</tspan></text>
<rect x="45.0" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="148.25" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="148.25" dy="0">원문은 S3에 보관</tspan><tspan x="148.25" dy="26">DB에는 메타데이터만</tspan></text>
<path d="M255.5 405H273.5" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="279.5" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="382.75" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="382.75" dy="0">LLM에 먼저 전달</tspan><tspan x="382.75" dy="26">파일명과 ID만</tspan></text>
<path d="M490.0 405H508.0" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="514.0" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="617.25" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="617.25" dy="0">본문이 필요할 때</tspan><tspan x="617.25" dy="26">파일 읽기 도구 호출</tspan></text>
<path d="M724.5 405H742.5" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="748.5" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="851.75" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="851.75" dy="0">서버가 범위를 제한</tspan><tspan x="851.75" dy="26">필요한 본문만 반환</tspan></text>
<text x="45" y="477" text-anchor="start" font-size="14" font-weight="450" fill="#376c5c"><tspan x="45" dy="0">서버는 TTL 캐시를 사용하고, 도구 응답 크기를 명시적으로 제한</tspan></text>
<text x="36" y="564" text-anchor="start" font-size="19" font-weight="650" fill="#376c5c"><tspan x="36" dy="0">파일 전체를 매번 넣지 않고, 도구로 읽은 범위만 다음 모델 입력에 추가</tspan></text>
</svg>