<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#7c8d80" stroke-width="1.4"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style>
<rect width="1000" height="610" fill="#fffefa"/>
<title id="title">채널 이름 해석 대신, 확정한 채널 ID로 실행</title><desc id="desc">채널 이름 → ID 매칭을 모델 밖에서 처리하고, 사용자가 선택한 대상을 유지</desc>
<text x="36" y="45" text-anchor="start" font-size="26" font-weight="720" fill="#273631"><tspan x="36" dy="0">채널 이름 해석 대신, 확정한 채널 ID로 실행</tspan></text>
<text x="36" y="75" text-anchor="start" font-size="15" font-weight="400" fill="#637168"><tspan x="36" dy="0">항상 필요한 작업 대상만 먼저 주고, 다른 채널은 필요할 때 검색</tspan></text>
<rect x="24" y="105" width="952" height="185" rx="10" fill="#fcf2ed" stroke="#ead5cb"/>
<text x="45" y="136" text-anchor="start" font-size="14" font-weight="750" fill="#9b5238"><tspan x="45" dy="0">AS-IS</tspan></text>
<rect x="45.0" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="187.33333333333334" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="187.33333333333334" dy="0">매 턴마다</tspan><tspan x="187.33333333333334" dy="26">전체 채널 목록 조회</tspan></text>
<path d="M333.6666666666667 195H351.6666666666667" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="357.6666666666667" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="500.0" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="500.0" dy="0">채널 목록 전체를</tspan><tspan x="500.0" dy="26">LLM 입력에 추가</tspan></text>
<path d="M646.3333333333334 195H664.3333333333334" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="670.3333333333334" y="156" width="284.6666666666667" height="78" rx="6" fill="#ffffff" stroke="#ead5cb"/>
<text x="812.6666666666667" y="187" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="812.6666666666667" dy="0">LLM이 채널 이름을</tspan><tspan x="812.6666666666667" dy="26">ID로 해석</tspan></text>
<text x="45" y="267" text-anchor="start" font-size="14" font-weight="450" fill="#9b5238"><tspan x="45" dy="0">목록이 반복 입력되고, 이름과 ID를 매칭하는 작업까지 모델이 수행</tspan></text>
<rect x="24" y="315" width="952" height="205" rx="10" fill="#eef5ee" stroke="#c9decb"/>
<text x="45" y="346" text-anchor="start" font-size="14" font-weight="750" fill="#376c5c"><tspan x="45" dy="0">TO-BE</tspan></text>
<rect x="45.0" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="148.25" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="148.25" dy="0">UI에서 사용자가</tspan><tspan x="148.25" dy="26">작업할 채널 선택</tspan></text>
<path d="M255.5 405H273.5" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="279.5" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="382.75" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="382.75" dy="0">서버가 선택한</tspan><tspan x="382.75" dy="26">채널 ID 확정</tspan></text>
<path d="M490.0 405H508.0" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="514.0" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="617.25" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="617.25" dy="0">선택한 채널 정보만</tspan><tspan x="617.25" dy="26">LLM에 전달</tspan></text>
<path d="M724.5 405H742.5" stroke="#7c8d80" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="748.5" y="366" width="206.5" height="78" rx="6" fill="#ffffff" stroke="#c9decb"/>
<text x="851.75" y="397" text-anchor="middle" font-size="18" font-weight="550" fill="#273631"><tspan x="851.75" dy="0">확정한 채널 ID로</tspan><tspan x="851.75" dy="26">도구 실행</tspan></text>
<text x="45" y="477" text-anchor="start" font-size="14" font-weight="450" fill="#376c5c"><tspan x="45" dy="0">다른 채널은 검색 도구로 탐색 · 검색 결과는 후보이며 바로 쓰기 대상으로 사용하지 않음</tspan></text>
<text x="36" y="564" text-anchor="start" font-size="19" font-weight="650" fill="#376c5c"><tspan x="36" dy="0">채널 이름 → ID 매칭을 모델 밖에서 처리하고, 사용자가 선택한 대상을 유지</tspan></text>
<text x="36" y="591" text-anchor="start" font-size="11" font-weight="400" fill="#7a827c"><tspan x="36" dy="0">사내 AI 에이전트 개선기 · 포트폴리오용 재구성</tspan></text>
</svg>