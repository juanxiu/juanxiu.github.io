<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">CPU·GPU·NPU 이기종 오케스트레이션 연구 구조</title>
<desc id="desc">VLM과 객체 탐지의 요청을 별도 큐에서 관리합니다. CPU가 GPU와 NPU의 연산 배치 및 실행 순서를 제어하고 실행 상태를 확인합니다. GPU와 NPU는 지원하는 모델 연산을 분담하며 중간 결과를 전달하고 동기화합니다. 구체적인 장치별 연산 배치는 측정 결과에 따라 정합니다.</desc>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style>
